name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:functions
      - run: npm audit --audit-level=high
      - run: npm --prefix functions audit --audit-level=high
      - run: npm run build
