  // Custom confirm dialog -- the artifact runs in a sandboxed iframe where the
  // native window.confirm() is blocked (it returns false silently), so every
  // destructive action needs its own in-page confirmation instead.
  function showConfirm(message, actionLabel, onConfirm) {
    var root = document.getElementById("confirmRoot");
    root.innerHTML = "";
    var backdrop = el('<div class="confirm-backdrop"></div>');
    var box = el('<div class="confirm-box"><div class="confirm-msg"></div><div class="confirm-actions"><button type="button" class="btn ghost confirm-dismiss" id="confirmCancel">Cancel</button><button type="button" class="btn danger" id="confirmOk"></button></div></div>');
    box.querySelector(".confirm-msg").textContent = message;
    box.querySelector("#confirmOk").textContent = actionLabel || "Delete";
    backdrop.appendChild(box);
    root.appendChild(backdrop);
    function close() { root.innerHTML = ""; }
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    box.querySelector("#confirmCancel").addEventListener("click", close);
    box.querySelector("#confirmOk").addEventListener("click", function () { close(); onConfirm(); });
  }

  // Same overlay, but for a choice between two or more named actions. Always dismissable --
  // tapping the backdrop, pressing Escape, or the built-in Cancel button all back out without
  // running any of the choices (onCancel, if given, runs so the caller can reset its own UI).
  function showChoice(message, choices, onCancel) {
    var root = document.getElementById("confirmRoot");
    root.innerHTML = "";
    var backdrop = el('<div class="confirm-backdrop"></div>');
    var box = el('<div class="confirm-box"><div class="confirm-msg"></div><div class="confirm-actions"></div></div>');
    box.querySelector(".confirm-msg").textContent = message;
    var actionsEl = box.querySelector(".confirm-actions");
    function cancel() { root.innerHTML = ""; if (onCancel) onCancel(); }
    choices.forEach(function (c) {
      var btn = el('<button type="button" class="btn' + (c.danger ? " danger" : c.primary ? " primary" : " ghost") + '"></button>');
      btn.textContent = c.label;
      btn.addEventListener("click", function () { root.innerHTML = ""; c.action(); });
      actionsEl.appendChild(btn);
    });
    var cancelBtn = el('<button type="button" class="btn ghost confirm-dismiss"></button>');
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", cancel);
    actionsEl.appendChild(cancelBtn);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) cancel(); });
    backdrop.appendChild(box);
    root.appendChild(backdrop);
  }

  // Same overlay again, but for a single line of free-text input (e.g. naming a new
  // branch from the tree view, where there's no inline form to swap into like the
  // timeline has). Enter submits, Escape/backdrop/Cancel dismiss without calling back.
  function showPrompt(message, placeholder, actionLabel, onSubmit) {
    var root = document.getElementById("confirmRoot");
    root.innerHTML = "";
    var backdrop = el('<div class="confirm-backdrop"></div>');
    var box = el('<div class="confirm-box"><div class="confirm-msg"></div><input type="text" class="field-input confirm-input"><div class="confirm-actions"><button type="button" class="btn ghost confirm-dismiss" id="cpCancel">Cancel</button><button type="button" class="btn primary" id="cpOk"></button></div></div>');
    box.querySelector(".confirm-msg").textContent = message;
    box.querySelector("#cpOk").textContent = actionLabel || "Add";
    var input = box.querySelector(".confirm-input");
    input.placeholder = placeholder || "";
    backdrop.appendChild(box);
    root.appendChild(backdrop);
    function close() { root.innerHTML = ""; }
    function submit() {
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      close();
      onSubmit(v);
    }
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    box.querySelector("#cpCancel").addEventListener("click", close);
    box.querySelector("#cpOk").addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submit(); } });
    setTimeout(function () { input.focus(); }, 30);
  }

  function readAndCompress(file, maxW, quality, cb) {
    if (!file || file.type.indexOf("image/") !== 0) { cb(null); return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        try { cb(canvas.toDataURL("image/jpeg", quality)); } catch (err) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

  /* ============================================================
     HANDLER REGISTRIES
     ============================================================ */
  var TAB_H = [];
  function H(fn) { TAB_H.push(fn); return TAB_H.length - 1; }
  var MODAL_H = [];
  function MH(fn) { MODAL_H.push(fn); return MODAL_H.length - 1; }
  function wire(root, registry, attr, evt) { root.querySelectorAll("[" + attr + "]").forEach(function (elm) { var idx = elm.getAttribute(attr); elm.addEventListener(evt, function (e) { registry[idx](e, elm); }); }); }
  function wireAll(root, registry) { wire(root, registry, "data-h", "click"); wire(root, registry, "data-hc", "change"); wire(root, registry, "data-hi", "input"); }

  /* ============================================================
     MODAL
     ============================================================ */
  function closeModal() { document.getElementById("modalRoot").innerHTML = ""; renderTab(); }
  function openModal(html, opts) {
    opts = opts || {};
    var root = document.getElementById("modalRoot");
    var backdrop = el('<div class="modal-backdrop' + (opts.centered ? " centered" : "") + '"></div>');
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });
    var sheet = el('<div class="modal-sheet"></div>');
    sheet.innerHTML = '<div class="modal-grip"></div><button class="modal-close">' + icon("x", 14) + '</button>' + html;
    sheet.querySelector(".modal-close").addEventListener("click", closeModal);
    backdrop.appendChild(sheet);
    root.innerHTML = "";
    root.appendChild(backdrop);
    wireAll(sheet, MODAL_H);
    return sheet;
  }
  function openLightbox(src) { openModal('<div style="text-align:center;"><img src="' + src + '" style="max-width:100%;border-radius:7px;"></div>', { centered: true }); }

  /* ============================================================
     PHASE MODAL
     ============================================================ */
  function insertPhase(parentArray, atIndex) {
    var nn = node("New phase", "", "", "upcoming");
    parentArray.splice(atIndex, 0, nn);
    saveState();
    closeModal();
    toast("New phase added — tap it to rename and set dates.");
  }

  function deletePhaseFlow(n, parentArray, cb) {
    // A branch can't be left with zero phases -- the layout (and the tree view
    // especially) assumes every branch has at least one. If this is the last phase in
    // its branch, point at deleting the branch itself instead of leaving it empty.
    if (parentArray.length === 1 && parentArray !== season().root) {
      toast('This is the only phase in its branch — delete the branch instead to remove it.');
      return;
    }
    var extra = [];
    if (n.notes.length) extra.push(n.notes.length + " note(s)");
    if (n.branches && n.branches.length) extra.push(n.branches.length + " branch(es) and everything inside them");
    var msg = 'Delete "' + n.name + '"?' + (extra.length ? " This also removes " + extra.join(" and ") + "." : "") + " This can't be undone.";
    showConfirm(msg, "Delete", function () {
      parentArray.splice(parentArray.indexOf(n), 1);
      delete state.branchSelection[n.id];
      saveState();
      cb();
    });
  }

  // Looks up a branch object anywhere in the season's tree by id -- needed by the tree
  // view, which only carries id/name/color/path in its layout records, not the live
  // branch object itself.
  function findBranchById(id) {
    var found = null;
    function walk(nodes) {
      nodes.forEach(function (n) {
        if (found || !n.branches) return;
        n.branches.forEach(function (b) {
          if (found) return;
          if (b.id === id) { found = b; return; }
          walk(b.nodes);
        });
      });
    }
    walk(season().root);
    return found;
  }

  // Like findBranchById, but also returns the branch's parent node -- needed to delete
  // a branch directly, since deleteBranchFlow needs both the owning node and the branch.
  function findBranchOwner(id) {
    var found = null;
    function walk(nodes) {
      nodes.forEach(function (n) {
        if (found || !n.branches) return;
        n.branches.forEach(function (b) {
          if (found) return;
          if (b.id === id) { found = { n: n, b: b }; return; }
          walk(b.nodes);
        });
      });
    }
    walk(season().root);
    return found;
  }

  function deleteBranchFlow(n, b, cb) {
    var noteCount = 0;
    function cn(a) { a.forEach(function (nn) { noteCount += nn.notes.length; if (nn.branches) nn.branches.forEach(function (bb) { cn(bb.nodes); }); }); }
    cn(b.nodes);
    var msg = 'Delete branch "' + b.name + '"? This permanently removes its ' + b.nodes.length + ' phase(s)' + (noteCount ? " and " + noteCount + " note(s)" : "") + ". This can't be undone.";
    showConfirm(msg, "Delete", function () {
      n.branches.splice(n.branches.indexOf(b), 1);
      if (state.branchSelection[n.id] === b.id) delete state.branchSelection[n.id];
      if (state.treeFocus === b.id) state.treeFocus = null;
      if (!n.branches.length) {
        n.branches = null;
      } else if (n.branches.length === 1) {
        // Down to one branch is really no branch at all -- fold its phases straight back
        // into the trunk right after n and drop the fork, so it reads as a single
        // sequence again instead of a lonely, still-tagged "branch".
        var remaining = n.branches[0];
        n.branches = null;
        if (state.branchSelection[n.id] !== undefined) delete state.branchSelection[n.id];
        if (state.treeFocus === remaining.id) state.treeFocus = null;
        var parentArr = findNodeParentArray(n);
        if (parentArr) {
          var idx = parentArr.indexOf(n);
          parentArr.splice.apply(parentArr, [idx + 1, 0].concat(remaining.nodes));
        }
      }
      saveState();
      cb();
    });
  }

  function countNotesDeep(nodes) {
    var count = 0;
    nodes.forEach(function (nn) {
      count += nn.notes.length;
      if (nn.branches) nn.branches.forEach(function (bb) { count += countNotesDeep(bb.nodes); });
    });
    return count;
  }

  // Creates a branch on n. If this is the FIRST branch at this point and n has phases
  // after it in parentArray, those existing phases become their own "Original" branch
  // (renamable later) rather than being folded into the new branch or discarded -- so
  // splitting for the first time always keeps everything, no destructive choice to make.
  // The new branch itself always starts from the standard phase set. Any later branch
  // (n already has branches) just gets the standard set directly, same as before.
  function addBranchToNode(n, parentArray, name, cb) {
    var isFirstBranch = !n.branches || n.branches.length === 0;
    if (!n.branches) n.branches = [];
    var idx = parentArray.indexOf(n);
    var trailing = (isFirstBranch && idx !== -1) ? parentArray.slice(idx + 1) : [];
    if (trailing.length) parentArray.splice(idx + 1);

    var original = null;
    if (trailing.length) {
      original = branch("Original", trailing);
      n.branches.push(original);
    }
    var nb = branch(name, standardPhaseSet(n.name));
    n.branches.push(nb);
    if (!state.branchSelection[n.id]) state.branchSelection[n.id] = original ? original.id : nb.id;
    saveState();
    cb({ branch: nb, original: original, carried: trailing });
  }

  // Shared toast copy for a just-added branch, whichever control (timeline or tree)
  // triggered it -- calls out when the pre-existing phases got moved into "Original".
  function branchAddedToast(name, result) {
    var msg = 'Branch "' + name + '" added.';
    msg += result.original ? ' The existing phases moved into a new "Original" branch — rename it anytime.' : " Started with the standard phases — edit or remove as needed.";
    toast(msg);
  }

  // Finds the array (season().root, or some branch's own .nodes) that directly contains
  // a given node -- needed to fold a collapsed branch's phases back into the trunk.
  function findNodeParentArray(target) {
    if (season().root.indexOf(target) !== -1) return season().root;
    var found = null;
    function walk(arr) {
      arr.forEach(function (nn) {
        if (found || !nn.branches) return;
        nn.branches.forEach(function (b) {
          if (found) return;
          if (b.nodes.indexOf(target) !== -1) { found = b.nodes; return; }
          walk(b.nodes);
        });
      });
    }
    walk(season().root);
    return found;
  }

  // Swaps the clicked "Add branch" trigger (an inline "+ Add branch" button or the
  // small "+" tab at the end of a branch-tabs row) for an inline name-entry form,
  // right on the timeline -- no modal needed.
  function showAddBranchForm(anchorElm, n, parentArray) {
    var form = el('<div class="tl-branch-form"><input type="text" class="field-input" placeholder="Branch name (e.g. Rosé)"><div class="tl-branch-form-row"><button type="button" class="btn primary">Add</button><button type="button" class="btn ghost">Cancel</button></div></div>');
    anchorElm.insertAdjacentElement("afterend", form);
    anchorElm.style.display = "none";
    var input = form.querySelector("input");
    input.focus();
    function cancel() { renderTab(); }
    function submit() {
      var name = input.value.trim();
      if (!name) { input.focus(); return; }
      addBranchToNode(n, parentArray, name, function (result) {
        branchAddedToast(name, result);
        renderTab();
      });
    }
    var btns = form.querySelectorAll(".btn");
    btns[0].addEventListener("click", submit);
    btns[1].addEventListener("click", cancel);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
      else if (e.key === "Escape") { cancel(); }
    });
  }

  function openPhaseModal(n, parentArray, accent) {
    MODAL_H = [];
    var ro = isReadOnly();       // gates only structural/destructive actions: delete this phase, delete a branch
    var roEdit = isArchived();   // title/dates/status/notes/branch names stay editable even while locked
    var roNotes = roEdit;        // kept as its own name where it's read for clarity below

    // The status line: once a phase has both a start and an end date, its status is
    // derived from today's date against that range and shown read-only -- there's
    // nothing to pick by hand any more. Without a full date range there's nothing to
    // derive it from, so it stays a manual seg-row like before.
    function statusSectionInner() {
      var hasDates = !!(n.start && n.end);
      if (hasDates) n.status = derivedStatus(n);
      if (!roEdit && !hasDates) {
        return '<div class="seg-row">' + ["upcoming", "active", "done"].map(function (s) {
          return '<button class="seg-btn' + (n.status === s ? " selected st-" + s : "") + '" data-h="' + MH(function () { n.status = s; saveState(); closeModal(); }) + '">' + s.charAt(0).toUpperCase() + s.slice(1) + '</button>';
        }).join("") + '</div>';
      }
      var autoNote = hasDates ? ' <span class="status-auto-note">— set automatically from the dates</span>' : "";
      return '<div style="font-size:13px;color:' + statusColorVar(n.status) + ';font-weight:600;">' + n.status.charAt(0).toUpperCase() + n.status.slice(1) + autoNote + '</div>';
    }

    var html = "";
    html += '<div class="modal-eyebrow">' + (n.branches ? "Split point" : "Phase") + '</div>';
    if (roEdit) {
      html += '<div class="title-input" style="cursor:default;">' + esc(n.name) + '</div>';
      html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">' + esc(fmtRange(n.start, n.end)) + '</div>';
    } else {
      html += '<input class="title-input" data-hc="' + MH(function (e) { n.name = e.target.value || "Untitled phase"; saveState(); }) + '" value="' + esc(n.name) + '">';
      html += '<div class="date-row"><input type="date" value="' + esc(n.start) + '" data-hc="' + MH(function (e) { n.start = e.target.value; saveState(); refreshStatus(); }) + '"><span class="arrow">→</span><input type="date" value="' + esc(n.end) + '" data-hc="' + MH(function (e) { n.end = e.target.value; saveState(); refreshStatus(); }) + '"></div>';
    }

    html += '<div class="modal-section"><h4>Status</h4><div id="statusSection">' + statusSectionInner() + '</div></div>';

    html += '<div class="modal-section"><h4>Notes</h4><div id="notesList"></div>';
    if (!roNotes) {
      html += '<div class="note-form"><div id="photoPreviewWrap"></div><div class="row">' +
        '<textarea id="noteInput" placeholder="Add an observation…"></textarea>' +
        '<input type="file" accept="image/*" id="notePhotoInput" style="display:none;">' +
        '<button type="button" class="icon-btn" id="notePhotoBtn">' + icon("camera", 17) + '</button>' +
        '<button type="button" class="icon-btn primary" id="noteSendBtn">' + icon("plus", 17) + '</button>' +
        '</div></div>';
    }
    html += '</div>';

    html += '<div class="modal-section"><h4>Checks &amp; events</h4><div id="eventsList"></div>';
    if (!roNotes) {
      html += '<div class="event-add-row"><input type="text" class="field-input" id="eventNameInput" placeholder="e.g. pH check">' +
        '<input type="date" class="field-input" id="eventDateInput">' +
        '<button type="button" class="icon-btn primary" id="eventAddBtn">' + icon("plus", 17) + '</button></div>';
    }
    html += '</div>';

    html += '<div class="modal-section"><h4>Inventory on this phase</h4><div id="invTagList"></div></div>';

    if (n.libIds && n.libIds.length) {
      html += '<div class="modal-section"><h4>Related library items</h4>' + n.libIds.map(function (tag) {
        var it = findLibByTag(tag);
        if (!it) return "";
        return '<span class="link-chip" data-h="' + MH(function () { closeModal(); goToTab("library"); setTimeout(function () { openLibraryModal(it, findLibSection(it) ? findLibSection(it).items : []); }, 0); }) + '">' + icon(it.image ? "image" : it.type === "video" ? "play" : "filetext", 14) + esc(it.title) + '</span>';
      }).join("") + '</div>';
    }

    html += '<div class="modal-section"><h4>Branches</h4><div id="branchList"></div></div>';

    if (!ro) html += '<button type="button" class="danger-link" id="deletePhaseBtn">Delete this phase</button>';

    var sheet = openModal(html);

    function refreshStatus() {
      var box = sheet.querySelector("#statusSection");
      box.innerHTML = statusSectionInner();
      wireAll(box, MODAL_H);
    }

    function renderNotes() {
      var list = sheet.querySelector("#notesList");
      if (!n.notes.length) { list.innerHTML = '<div class="empty-note">No notes yet.</div>'; return; }
      list.innerHTML = n.notes.map(function (nt) {
        return '<div class="note-item"><div class="meta"><span>' + esc(fmtDate(nt.date)) + '</span>' + (roNotes ? "" : '<button type="button" class="note-del" data-note-id="' + nt.id + '">' + icon("trash", 14) + '</button>') + '</div>' + (nt.text ? '<div class="body">' + esc(nt.text) + '</div>' : "") + (nt.image ? '<img src="' + nt.image + '" data-lightbox="1">' : "") + '</div>';
      }).join("");
      list.querySelectorAll("[data-lightbox]").forEach(function (img) { img.addEventListener("click", function () { openLightbox(img.src); }); });
      list.querySelectorAll(".note-del").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var noteId = btn.getAttribute("data-note-id");
          showConfirm("Delete this note? This can't be undone.", "Delete", function () {
            var idx = n.notes.findIndex(function (nt) { return nt.id === noteId; });
            if (idx !== -1) n.notes.splice(idx, 1);
            saveState();
            renderNotes();
          });
        });
      });
    }
    renderNotes();

    if (!roNotes) {
      var pendingImg = null;
      var photoInput = sheet.querySelector("#notePhotoInput");
      var photoWrap = sheet.querySelector("#photoPreviewWrap");
      sheet.querySelector("#notePhotoBtn").addEventListener("click", function () { photoInput.click(); });
      photoInput.addEventListener("change", function () {
        var file = photoInput.files[0];
        if (!file) return;
        readAndCompress(file, 900, 0.72, function (dataUrl) {
          if (!dataUrl) { toast("Couldn't read that photo."); return; }
          pendingImg = dataUrl;
          photoWrap.innerHTML = '<div class="photo-preview"><img src="' + dataUrl + '"><button type="button" class="rm">' + icon("x", 10) + '</button></div>';
          photoWrap.querySelector(".rm").addEventListener("click", function () { pendingImg = null; photoWrap.innerHTML = ""; });
        });
      });
      function submitNote() {
        var ta = sheet.querySelector("#noteInput");
        var text = ta.value.trim();
        if (!text && !pendingImg) return;
        n.notes.push({ id: uid("note"), date: todayISO(), text: text, image: pendingImg });
        saveState(); ta.value = ""; pendingImg = null; photoWrap.innerHTML = ""; photoInput.value = "";
        renderNotes();
      }
      sheet.querySelector("#noteSendBtn").addEventListener("click", submitNote);
    }

    function renderEvents() {
      var list = sheet.querySelector("#eventsList");
      var evs = ensureEvents(n).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      if (!evs.length) { list.innerHTML = '<div class="empty-note">No checks or events yet.</div>'; return; }
      list.innerHTML = evs.map(function (ev) {
        var d = daysUntil(ev.date);
        var soon = n.status !== "done" && d !== null && d <= state.eventAlertDays;
        return '<div class="event-item' + (soon ? " is-soon" : "") + '"><span class="ev-date">' + esc(fmtDate(ev.date)) + '</span><span class="ev-name">' + esc(ev.name) + '</span>' + (roNotes ? "" : '<button type="button" class="event-del" data-event-id="' + ev.id + '">' + icon("trash", 14) + '</button>') + '</div>';
      }).join("");
      list.querySelectorAll(".event-del").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var evId = btn.getAttribute("data-event-id");
          showConfirm("Delete this check? This can't be undone.", "Delete", function () {
            var idx = n.events.findIndex(function (e) { return e.id === evId; });
            if (idx !== -1) n.events.splice(idx, 1);
            saveState();
            renderEvents();
          });
        });
      });
    }
    renderEvents();

    if (!roNotes) {
      var eventNameInput = sheet.querySelector("#eventNameInput");
      var eventDateInput = sheet.querySelector("#eventDateInput");
      sheet.querySelector("#eventAddBtn").addEventListener("click", function () {
        var evName = eventNameInput.value.trim();
        var evDate = eventDateInput.value;
        if (!evName || !evDate) { (evName ? eventDateInput : eventNameInput).focus(); return; }
        ensureEvents(n).push({ id: uid("ev"), name: evName, date: evDate });
        saveState();
        eventNameInput.value = ""; eventDateInput.value = "";
        renderEvents();
      });
    }

    function renderInvTags() {
      var wrap = sheet.querySelector("#invTagList");
      var all = allInvItems();
      var linked = all.filter(function (it) { return findResolvedIds(n).indexOf(it.id) !== -1; });
      wrap.innerHTML = linked.length ? linked.map(function (it) { var st = invStatus(it); return '<span class="link-chip" data-h="' + MH(function () { closeModal(); goToTab("inventory"); setTimeout(function () { openInventoryModal(it, findInvSection(it) ? findInvSection(it).items : []); }, 0); }) + '"><span class="dot" style="background:' + invStatusColorVar(st) + '"></span>' + esc(it.name) + '</span>'; }).join("") : '<div class="empty-note">Nothing tagged yet — tag items to this phase from the Inventory tab.</div>';
      wireAll(wrap, MODAL_H);
    }
    renderInvTags();

    // Adding a branch lives only on the timeline now (inline "Add branch" / the "+" tab) --
    // this list is just for managing branches that already exist: rename or delete them.
    function renderBranches() {
      var wrap = sheet.querySelector("#branchList");
      if (!n.branches || !n.branches.length) { wrap.innerHTML = '<div class="empty-note">No branches yet — use "Add branch" on the timeline to split here.</div>'; return; }
      wrap.innerHTML = "";
      n.branches.forEach(function (b, i) {
        var color = branchColor(accent, i);
        var row = el('<div class="branch-row"><span class="sw" style="background:' + color + '"></span><input value="' + esc(b.name) + '"><span class="cnt">' + b.nodes.length + ' phase' + (b.nodes.length === 1 ? "" : "s") + '</span></div>');
        if (!roEdit) row.querySelector("input").addEventListener("change", function (e) { b.name = e.target.value || "Branch"; e.target.value = b.name; saveState(); });
        else row.querySelector("input").disabled = true;
        if (!ro) {
          var xBtn = el('<button type="button" class="icon-x">' + icon("x", 14) + '</button>');
          xBtn.addEventListener("click", function () { deleteBranchFlow(n, b, closeModal); });
          row.appendChild(xBtn);
        }
        wrap.appendChild(row);
      });
    }
    renderBranches();

    if (!ro) {
      sheet.querySelector("#deletePhaseBtn").addEventListener("click", function () {
        deletePhaseFlow(n, parentArray, closeModal);
      });
    }
  }

  /* ============================================================
     RENDER: TIMELINE
     ============================================================ */
  function statusMeta(n) {
    if (n.status === "done") return { cls: "st-done", icon: "check", label: "Done" };
    if (n.status === "active") return { cls: "st-active", icon: "dot", label: "Active" };
    return { cls: "", icon: null, label: "Upcoming" };
  }

  function phaseRowHtml(n, parentArray, accent, railCls) {
    var sm = statusMeta(n);
    var ro = isReadOnly();
    var hasBranches = n.branches && n.branches.length;
    var stateCls = n.status === "done" ? "is-done" : n.status === "active" ? "is-active" : "";
    var tags = (n.invIds || []).map(function (tag) { var it = findInvByTag(tag); if (!it) return ""; var st = invStatus(it); return '<span class="ptag st-' + st + '">' + esc(it.name) + '</span>'; }).join("");
    var alertBadge = phaseNeedsAttention(n) ? '<div class="phase-alert">' + icon("alert", 12) + phaseAlertText(n) + '</div>' : "";
    var delBtn = ro ? "" : '<button type="button" class="tl-del-btn" title="Delete phase" data-h="' + H(function (e) { e.stopPropagation(); deletePhaseFlow(n, parentArray, closeModal); }) + '">' + icon("trash", 15) + '</button>';
    var addRow = "";
    if (!ro && !hasBranches) {
      addRow = '<div class="tl-add-row">' +
        '<button type="button" class="tl-add-btn" title="Add phase" data-h="' + H(function () { insertPhase(parentArray, parentArray.indexOf(n) + 1); }) + '">' + icon("plus", 12) + 'Add phase</button>' +
        '<button type="button" class="tl-add-btn" title="Add branch" data-h="' + H(function (e, elm) { showAddBranchForm(elm, n, parentArray); }) + '">' + icon("branch", 12) + 'Add branch</button>' +
        '</div>';
    }
    return '<div class="tl-row ' + railCls + '"><div class="tl-rail" style="--accent:' + accent + '"><span class="tl-dot" style="background:' + accent + '"></span></div>' +
      '<div class="tl-card-wrap"><div class="phase-card ' + stateCls + '" tabindex="0" role="button" style="--accent:' + accent + '" data-h="' + H(function () { openPhaseModal(n, parentArray, accent); }) + '">' +
      '<div class="phase-header"><div class="phase-info"><div class="phase-name">' + esc(n.name) + '</div><div class="phase-dates">' + esc(fmtRange(n.start, n.end)) + '</div>' +
      (tags ? '<div class="ptag-row">' + tags + '</div>' : "") + '</div>' +
      '<div class="phase-status ' + sm.cls + '">' + (sm.icon ? icon(sm.icon, 12) : "") + sm.label + '</div>' +
      delBtn +
      '</div>' + alertBadge + '</div>' + addRow + '</div></div>';
  }

  function renderNodeSeq(nodes, accent, container) {
    var ro = isReadOnly();
    var curBox = el('<div class="content-area"></div>');
    container.appendChild(curBox);

    if (!nodes.length) {
      if (!ro) {
        var firstBtn = el('<button type="button" class="add-row">' + icon("plus", 13) + 'Add phase</button>');
        firstBtn.addEventListener("click", function () { insertPhase(nodes, 0); });
        curBox.appendChild(firstBtn);
      }
      return;
    }

    nodes.forEach(function (n, i) {
      var hasBranches = n.branches && n.branches.length;
      var railCls = (i === 0 ? "tl-first " : "") + (i === nodes.length - 1 && !hasBranches ? "tl-last " : "");
      curBox.insertAdjacentHTML("beforeend", phaseRowHtml(n, nodes, accent, railCls));
      if (!hasBranches) return;

      var sel = state.branchSelection[n.id];
      var chosen = n.branches.filter(function (b) { return b.id === sel; })[0] || n.branches[0];
      var chosenIdx = n.branches.indexOf(chosen);
      // Every branch's color is derived the same way the tree does it: fresh from the
      // palette when splitting straight off the trunk, a shade of `accent` (the color of
      // whatever we're already inside) when splitting further -- so a sub-branch of Red
      // reads as a variant of red rather than an unrelated palette color.
      var branchColors = n.branches.map(function (b, bi) { return branchColor(accent, bi); });
      var chosenColor = branchColors[chosenIdx];

      var addTab = ro ? "" : '<button type="button" class="add-branch-tab" title="Add branch" data-h="' + H(function (e, elm) { showAddBranchForm(elm, n, nodes); }) + '">' + icon("plus", 14) + '</button>';
      var sepDiv = document.createElement("div");
      sepDiv.innerHTML = '<div class="split-sep"><span class="sd" style="background:' + accent + '"></span></div><div class="branch-tabs">' +
        n.branches.map(function (b, bi) {
          var c = branchColors[bi];
          var btDel = ro ? "" : '<button type="button" class="bt-del" title="Delete branch" data-h="' + H(function (e) { e.stopPropagation(); deleteBranchFlow(n, b, closeModal); }) + '">' + icon("trash", 13) + '</button>';
          return '<div class="branch-tab' + (b.id === chosen.id ? " active" : "") + '" tabindex="0" role="button" style="--tab-accent:' + c + '" data-h="' + H(function () { state.branchSelection[n.id] = b.id; saveState(); renderTab(); }) + '"><span class="bt-dot" style="background:' + c + '"></span><span class="bn">' + esc(b.name) + '</span>' + btDel + '</div>';
        }).join("") + addTab + '</div>';
      container.appendChild(sepDiv);

      var branchWrap = document.createElement("div");
      container.appendChild(branchWrap);
      renderNodeSeq(chosen.nodes, chosenColor, branchWrap);

      if (i < nodes.length - 1) { curBox = el('<div class="content-area"></div>'); container.appendChild(curBox); }
    });
  }

  function renderTimelineView(container) {
    renderNodeSeq(season().root, TRUNK_COLOR, container);
    wireAll(container, TAB_H);
  }

  /* ============================================================
     RENDER: TREE (nodes & edges)
     ============================================================ */
  // Lays the season out as a dendrogram: a straight run of phases is one vertical "chain"
  // in a single column; the moment a chain forks, each branch claims its own column
  // (recursively, so a branch that itself forks just adds more columns), and a chain's
  // column is centered above the span of columns its branches end up occupying.
  // pathsCompatible: two branch-id paths are "compatible" -- i.e. neither is off in a
  // sibling branch relative to the other -- when one is a prefix of the other. That
  // covers both directions focus needs: the spine leading up to a fork (a prefix of the
  // focused branch's path) and everything nested inside the focused branch (which has
  // the focused path as ITS prefix). Anywhere the two paths disagree at some fork, the
  // node belongs to a sibling branch and should dim.
  function pathsCompatible(a, b) {
    var n = Math.min(a.length, b.length);
    for (var i = 0; i < n; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function buildTreeLayout() {
    var out = { nodes: [], edges: [], branches: [] };
    var nextLeafCol = 0;
    function walk(nodes, depth, color, branchId, branchName, path) {
      var chainRecords = nodes.map(function (n, i) {
        return { n: n, parentArray: nodes, depth: depth + i, color: color, col: null, branchId: branchId, branchName: i === 0 ? branchName : null, path: path, isLeaf: false };
      });
      for (var i = 1; i < chainRecords.length; i++) {
        out.edges.push({ fromRec: chainRecords[i - 1], toRec: chainRecords[i], color: color, kind: "chain" });
      }
      var last = nodes[nodes.length - 1];
      var startCol, endCol;
      if (last.branches && last.branches.length) {
        var lastRec = chainRecords[chainRecords.length - 1];
        startCol = null; endCol = null;
        last.branches.forEach(function (b, bi) {
          var childColor = branchColor(color, bi);
          var childPath = path.concat([b.id]);
          out.branches.push({ id: b.id, name: b.name, color: childColor, path: childPath });
          var res = walk(b.nodes, depth + nodes.length, childColor, b.id, b.name, childPath);
          if (startCol === null) startCol = res.start;
          endCol = res.end;
          out.edges.push({ fromRec: lastRec, toRec: res.chainRecords[0], color: childColor, kind: "branch" });
        });
      } else {
        chainRecords[chainRecords.length - 1].isLeaf = true;
        startCol = nextLeafCol; endCol = nextLeafCol + 1; nextLeafCol++;
      }
      var col = (startCol + endCol - 1) / 2;
      chainRecords.forEach(function (rec) { rec.col = col; out.nodes.push(rec); });
      return { start: startCol, end: endCol, chainRecords: chainRecords };
    }
    if (season().root.length) walk(season().root, 0, TRUNK_COLOR, null, null, []);
    return out;
  }

  function toggleTreeFocus(branchId) {
    state.treeFocus = (state.treeFocus === branchId) ? null : branchId;
    renderTab();
  }

  function renderTreeView(container) {
    var COL_W = 164, ROW_H = 70, NODE_W = 124, NODE_H = 36, ADD_ROW_H = 34, TOP_PAD = 54;
    var layout = buildTreeLayout();
    var wrap = el('<div class="content-area"></div>');
    container.appendChild(wrap);
    if (!layout.nodes.length) {
      wrap.innerHTML = '<div class="empty-all">No phases yet — add some from the Timeline view.</div>';
      return;
    }
    var ro = isReadOnly();          // gates structural actions: add/delete phase, add branch
    var roEditTree = ro;             // renaming in the tree (root title, branch names) now requires the editor unlocked, same as structural edits

    // Resolve the focused branch (if any) and dim everything that isn't the spine
    // leading to it or nested inside it. A branch that got deleted out from under an
    // active focus just quietly falls back to "show all".
    var focusBranch = state.treeFocus ? layout.branches.filter(function (b) { return b.id === state.treeFocus; })[0] : null;
    if (state.treeFocus && !focusBranch) state.treeFocus = null;
    var focusPath = focusBranch ? focusBranch.path : null;
    layout.nodes.forEach(function (rec) { rec.dim = !!(focusPath && !pathsCompatible(rec.path, focusPath)); });
    layout.edges.forEach(function (e) { e.dim = !!(focusPath && (e.fromRec.dim || e.toRec.dim)); });

    var maxCol = 0, maxDepth = 0;
    layout.nodes.forEach(function (r) { if (r.col > maxCol) maxCol = r.col; if (r.depth > maxDepth) maxDepth = r.depth; });
    var W = (maxCol + 1) * COL_W + 24; // extra room for the fork-add control on the rightmost column
    var TH = (maxDepth + 1) * ROW_H + TOP_PAD + ADD_ROW_H;
    function px(rec) { return { x: rec.col * COL_W + COL_W / 2, y: rec.depth * ROW_H + ROW_H / 2 + TOP_PAD }; }

    var svgPaths = layout.edges.map(function (e) {
      var p1 = px(e.fromRec), p2 = px(e.toRec);
      var y1 = p1.y + NODE_H / 2, y2 = p2.y - NODE_H / 2;
      var d, w = e.kind === "branch" ? 2.5 : 2, op = (e.kind === "branch" ? 0.7 : 0.4) * (e.dim ? 0.35 : 1);
      if (e.kind === "chain") d = 'M' + p1.x + ' ' + y1 + ' L' + p2.x + ' ' + y2;
      else { var midY = (y1 + y2) / 2; d = 'M' + p1.x + ' ' + y1 + ' C ' + p1.x + ' ' + midY + ', ' + p2.x + ' ' + midY + ', ' + p2.x + ' ' + y2; }
      return '<path d="' + d + '" stroke="' + e.color + '" stroke-width="' + w + '" fill="none" opacity="' + op + '" stroke-linecap="round"/>';
    }).join("");

    // layout.nodes is built in a post-order walk (a chain's own records are pushed only
    // after everything its branches recurse into), so the array's first entry is often
    // some deep descendant, NOT the season's actual first phase -- look it up directly.
    var rootRec = layout.nodes.filter(function (r) { return r.n === season().root[0]; })[0] || layout.nodes[0];
    var rootPx = px(rootRec);
    var rootDot = '<circle cx="' + rootPx.x + '" cy="' + (rootPx.y - NODE_H / 2 - 12) + '" r="3.5" fill="' + rootRec.color + '"/><line x1="' + rootPx.x + '" y1="' + (rootPx.y - NODE_H / 2 - 8) + '" x2="' + rootPx.x + '" y2="' + (rootPx.y - NODE_H / 2) + '" stroke="' + rootRec.color + '" stroke-width="2" opacity="0.5"/>';

    // The production's own name, shown the same way a branch's name is -- a small tag
    // above the very first node -- so the whole tree reads as "this vintage, splitting
    // into these branches" rather than starting on an unlabeled trunk. Same pattern as a
    // branch tag: the label itself is just text, the pencil beside it renames it.
    var rootEditBtn = roEditTree ? "" : '<button type="button" class="tn-branch-edit" title="Rename this vintage" data-h="' + H(function () {
      showPrompt("Name this vintage:", "e.g. 2026 Vintage", "Save", function (val) { season().title = val; saveState(); renderTab(); });
    }) + '">' + icon("pencil", 9) + '</button>';
    var rootTag = '<div class="tn-root-tag-wrap" style="left:' + rootPx.x + 'px;top:' + (rootPx.y - NODE_H / 2 - 44) + 'px;">' +
      '<span class="tn-root-tag is-static">' + esc(seasonTitle()) + '</span>' + rootEditBtn + '</div>';

    var nodesHtml = layout.nodes.map(function (rec) {
      var p = px(rec);
      var dimCls = rec.dim ? " is-dim" : "";
      var stateCls = (rec.n.status === "done" ? " is-done" : rec.n.status === "active" ? " is-active" : "") + dimCls;
      var alertDot = phaseNeedsAttention(rec.n) ? '<span class="tn-alert" title="Needs attention">' + icon("alert", 10) + '</span>' : "";
      var delBtn = ro ? "" : '<button type="button" class="tn-del" title="Delete phase" data-h="' + H(function (e) { e.stopPropagation(); deletePhaseFlow(rec.n, rec.parentArray, function () { renderTab(); }); }) + '">' + icon("trash", 11) + '</button>';

      // Branch name tag: a small tappable pill anchored to the node's own top-right
      // corner rather than centered above it, so it never sits over the connecting
      // line (which always arrives dead-center on the node's top edge). Tap the name to
      // focus that branch; the little pencil beside it renames it instead.
      var tag = "";
      if (rec.branchName) {
        var isFocused = rec.branchId === state.treeFocus;
        var tagColorStyle = isFocused
          ? ('background:' + rec.color + ';color:var(--surface);border-color:' + rec.color + ';')
          : ('color:' + rec.color + ';border-color:color-mix(in srgb, ' + rec.color + ' 45%, var(--border));');
        var branchId = rec.branchId;
        var nameBtn = '<button type="button" class="tn-branch-tag" style="' + tagColorStyle + '" title="Focus on ' + esc(rec.branchName) + '" data-h="' + H(function () { toggleTreeFocus(branchId); }) + '">' + esc(rec.branchName) + '</button>';
        // One small "more" button covers both rename and delete via a single choice sheet --
        // two separate icon buttons here used to crowd the tag and spill into the next
        // column on longer names. Only shown once the tree is unlocked (editor mode).
        var moreBtn = roEditTree ? "" : '<button type="button" class="tn-branch-edit" title="Branch options" data-h="' + H(function () {
          showChoice('"' + rec.branchName + '"', [
            { label: "Rename", primary: true, action: function () {
              showPrompt('Rename this branch:', "Branch name", "Save", function (val) {
                var b = findBranchById(branchId);
                if (b) { b.name = val; saveState(); }
                renderTab();
              });
            } },
            { label: "Delete", danger: true, action: function () {
              var owner = findBranchOwner(branchId);
              if (owner) deleteBranchFlow(owner.n, owner.b, function () { renderTab(); });
            } }
          ]);
        }) + '">' + icon("more", 9) + '</button>';
        // Anchored to the node's own LEFT edge (not offset to the right of its center) so
        // the tag hugs its own column and grows rightward only as far as the node itself
        // is wide -- it never creeps into a neighboring branch's column at a fork.
        tag = '<div class="tn-branch-tag-wrap' + dimCls + '" style="left:' + (p.x - NODE_W / 2) + 'px;top:' + (p.y - NODE_H / 2 - 19) + 'px;">' + nameBtn + moreBtn + '</div>';
      }

      var nodeHtml = '<div class="tree-node' + stateCls + '" style="left:' + (p.x - NODE_W / 2) + 'px;top:' + (p.y - NODE_H / 2) + 'px;width:' + NODE_W + 'px;height:' + NODE_H + 'px;--accent:' + rec.color + ';" title="' + esc(rec.n.name) + '" data-h="' + H(function () { openPhaseModal(rec.n, rec.parentArray, rec.color); }) + '"><span class="tn-label">' + esc(rec.n.name) + '</span>' + alertDot + delBtn + '</div>';

      // Add-phase / add-branch controls sit below every open-ended node (one without its
      // own branches already), not just the ones at the very bottom of the tree -- so you
      // can split or extend the sequence from any point, matching the timeline.
      var addRow = "";
      if (!ro && !(rec.n.branches && rec.n.branches.length)) {
        addRow = '<div class="tn-add-row' + dimCls + '" style="left:' + (p.x - 22) + 'px;top:' + (p.y + NODE_H / 2 + 5) + 'px;">' +
          '<button type="button" class="tn-add-btn" title="Add phase" data-h="' + H(function () { insertPhase(rec.parentArray, rec.parentArray.indexOf(rec.n) + 1); }) + '">' + icon("plus", 12) + '</button>' +
          '<button type="button" class="tn-add-btn" title="Add branch" data-h="' + H(function () {
            showPrompt('Name the new branch off "' + rec.n.name + '":', "Branch name (e.g. Rosé)", "Add", function (name) {
              addBranchToNode(rec.n, rec.parentArray, name, function (result) {
                branchAddedToast(name, result);
                renderTab();
              });
            });
          }) + '">' + icon("branch", 12) + '</button>' +
          '</div>';
      }

      // A node that already has branches has no add-row below it (that space holds the
      // fork's outgoing lines) -- give it a small "add another branch" control off its
      // right edge instead, so a 3rd, 4th, etc. branch can still be forked from here.
      var forkAdd = "";
      if (!ro && rec.n.branches && rec.n.branches.length) {
        forkAdd = '<button type="button" class="tn-fork-add' + dimCls + '" style="left:' + (p.x + NODE_W / 2 + 4) + 'px;top:' + (p.y - 9) + 'px;" title="Add another branch" data-h="' + H(function () {
          showPrompt('Name the new branch off "' + rec.n.name + '":', "Branch name (e.g. Rosé)", "Add", function (name) {
            addBranchToNode(rec.n, rec.parentArray, name, function (result) {
              branchAddedToast(name, result);
              renderTab();
            });
          });
        }) + '">' + icon("branch", 11) + '</button>';
      }

      return tag + nodeHtml + addRow + forkAdd;
    }).join("");

    var hint = focusBranch
      ? 'Showing "' + esc(focusBranch.name) + '" in focus · tap another branch name to switch<button type="button" class="tree-focus-clear" data-h="' + H(function () { state.treeFocus = null; renderTab(); }) + '">Show all</button>'
      : "Tap a node to open it · tap a branch name to focus it";

    wrap.innerHTML = '<div class="tree-hint">' + hint + '</div>' +
      '<div class="tree-scroll"><div class="tree-canvas" style="width:' + W + 'px;height:' + TH + 'px;">' +
      '<svg class="tree-svg" width="' + W + '" height="' + TH + '" viewBox="0 0 ' + W + ' ' + TH + '">' + rootDot + svgPaths + '</svg>' +
      rootTag + nodesHtml + '</div></div>';
    wireAll(container, TAB_H);
  }

  /* ============================================================
     RENDER: CALENDAR
     ============================================================ */
  function walkSelected(nodes, color, visit) {
    nodes.forEach(function (n) {
      visit(n, color, nodes);
      if (n.branches && n.branches.length) {
        var sel = state.branchSelection[n.id];
        var chosen = n.branches.filter(function (b) { return b.id === sel; })[0] || n.branches[0];
        var idx = n.branches.indexOf(chosen);
        walkSelected(chosen.nodes, branchColor(color, idx), visit);
      }
    });
  }
  // Every calendar entry (a phase's own date range, or one of its checks/events) is
  // normalized to a uniform {start, end} so the calendar can place both kinds without
  // caring which one it is. A sub-event entry additionally carries `subEvent`.
  function collectEvents() {
    var out = [];
    walkSelected(season().root, TRUNK_COLOR, function (n, color, parent) {
      if (n.start) out.push({ node: n, color: color, parent: parent, start: n.start, end: n.end || n.start });
      (n.events || []).forEach(function (ev) {
        out.push({ node: n, color: color, parent: parent, start: ev.date, end: ev.date, subEvent: ev });
      });
    });
    return out;
  }
  function currentCalMonth() { return state.calMonth || todayISO().slice(0, 7); }
  function shiftMonth(ym, delta) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1; var d = new Date(y, m + delta, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }

  function renderCalendarView(container) {
    var ym = currentCalMonth();
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1;
    var firstDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var events = collectEvents();
    var today = new Date();
    var isThisMonth = today.getFullYear() === y && today.getMonth() === m;
    function eventsOnDay(day) { var d = new Date(y, m, day); return events.filter(function (ev) { var e0 = parseDate(ev.end), s0 = parseDate(ev.start); return d >= s0 && d <= e0; }); }

    var html = '<div class="content-area"><div class="cal-nav"><button data-h="' + H(function () { state.calMonth = shiftMonth(ym, -1); renderTab(); }) + '">' + icon("chevronLeft", 16) + '</button><div class="cal-month">' + MONTHS[m] + " " + y + '</div><button data-h="' + H(function () { state.calMonth = shiftMonth(ym, 1); renderTab(); }) + '">' + icon("chevronRight", 16) + '</button></div>';
    html += '<div class="cal-grid">' + DOW.map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join("");
    for (var i = 0; i < firstDow; i++) html += '<div class="cal-cell empty"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var evs = eventsOnDay(day);
      html += '<div class="cal-cell' + (isThisMonth && today.getDate() === day ? " today" : "") + '">' + day;
      if (evs.length) html += '<div class="dots">' + evs.slice(0, 3).map(function (ev) { return '<div class="dot" style="background:' + (ev.subEvent ? ev.color : statusColorVar(ev.node.status)) + '"></div>'; }).join("") + '</div>';
      html += '</div>';
    }
    html += '</div><div class="cal-agenda-title">Events this month</div>';
    var monthStart = new Date(y, m, 1), monthEnd = new Date(y, m + 1, 0);
    var monthEvents = events.filter(function (ev) { var s0 = parseDate(ev.start), e0 = parseDate(ev.end); return s0 <= monthEnd && e0 >= monthStart; })
      .sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
    if (!monthEvents.length) html += '<div class="cal-empty">No events in ' + MONTHS[m] + '.</div>';
    else html += monthEvents.map(function (ev) {
      // a phase's own span, or one of its checks/events -- checks carry a small tag and
      // show which phase they belong to, since their own "name" is just the check itself.
      var isSub = !!ev.subEvent;
      var title = isSub ? esc(ev.subEvent.name) + ' <span class="cal-check-tag">check</span>' : esc(ev.node.name);
      var dateText = isSub ? fmtDate(ev.subEvent.date) + ' — ' + ev.node.name : fmtRange(ev.node.start, ev.node.end);
      return '<div class="cal-event" data-h="' + H(function () { openPhaseModal(ev.node, ev.parent, ev.color); }) + '"><div class="bar" style="background:' + (isSub ? ev.color : statusColorVar(ev.node.status)) + '"></div><div style="flex:1;min-width:0;"><div class="t">' + title + '</div><div class="d">' + esc(dateText) + '</div></div></div>';
    }).join("");
    html += '<button type="button" class="export-btn" data-h="' + H(function () { toast("Calendar export will download an .ics file in the full app."); }) + '">' + icon("calendar", 14) + 'Export to calendar</button></div>';
    container.innerHTML = html;
    wireAll(container, TAB_H);
  }

  /* ============================================================
     GENERIC SECTION LIST (shared shape for inventory + library)
     ============================================================ */
  function renderSectionControls(sec, secArr, ro) {
    var i = secArr.indexOf(sec);
    var html = '<div class="sec-head">';
    if (ro) html += '<div class="sec-name">' + esc(sec.name) + '</div>';
    else {
      html += '<input class="sec-name-input" value="' + esc(sec.name) + '" data-hc="' + H(function (e) { sec.name = e.target.value || "Section"; saveState(); }) + '">';
      html += '<div class="sec-actions">' +
        '<button class="sec-icon-btn" data-h="' + H(function () { moveInArr(secArr, sec, -1); saveState(); renderTab(); }) + '"' + (i === 0 ? " disabled" : "") + '>' + icon("chevronUp", 13) + '</button>' +
        '<button class="sec-icon-btn" data-h="' + H(function () { moveInArr(secArr, sec, 1); saveState(); renderTab(); }) + '"' + (i === secArr.length - 1 ? " disabled" : "") + '>' + icon("chevronDown", 13) + '</button>' +
        '<button class="sec-icon-btn" data-h="' + H(function () {
          showConfirm('Delete section "' + sec.name + '" and its ' + sec.items.length + ' item(s)? This can\'t be undone.', "Delete", function () {
            secArr.splice(secArr.indexOf(sec), 1); saveState(); renderTab();
          });
        }) + '">' + icon("trash", 13) + '</button></div>';
    }
    html += '</div>';
    return html;
  }

  function renderAddSectionRow(container, secArr, placeholder, atIndex) {
    var wrap = el('<div style="padding:14px 16px 4px;"></div>');
    var btn = el('<button type="button" class="add-row">' + icon("plus", 13) + 'Add section</button>');
    wrap.appendChild(btn);
    btn.addEventListener("click", function () {
      var form = el('<div class="inline-form" style="margin:0;"><div><span class="field-label">Section name</span><input class="field-input" id="secName" placeholder="' + placeholder + '"></div><div class="form-actions"><button type="button" class="btn primary" id="secSave">Add</button><button type="button" class="btn ghost" id="secCancel">Cancel</button></div></div>');
      wrap.replaceChild(form, btn);
      form.querySelector("#secName").focus();
      form.querySelector("#secCancel").addEventListener("click", function () { renderTab(); });
      form.querySelector("#secSave").addEventListener("click", function () {
        var name = form.querySelector("#secName").value.trim();
        if (!name) { form.querySelector("#secName").focus(); return; }
        var idx = (atIndex === undefined || atIndex === null) ? secArr.length : atIndex;
        secArr.splice(idx, 0, section(name, []));
        saveState(); renderTab();
      });
    });
    container.appendChild(wrap);
  }

  /* ============================================================
     RENDER: INVENTORY
     ============================================================ */
  function renderInventoryTab(container) {
    var ro = isReadOnly();
    var data = INVENTORY[state.year] || { sections: [] };
    var allItems = allInvItems();
    var outstanding = allItems.filter(function (it) { return it.haveQty < it.neededQty && it.price; });
    var totalCost = outstanding.reduce(function (a, it) { return a + it.price; }, 0);
    var counts = { all: allItems.length, need: 0, partial: 0, have: 0 };
    allItems.forEach(function (it) { counts[invStatus(it)]++; });

    var html = "";
    if (totalCost > 0) html += '<div class="summary-strip"><div><div class="amt num">' + totalCost.toLocaleString() + ' kr</div><div class="lbl">still to buy</div></div><div class="lbl">' + outstanding.length + ' item' + (outstanding.length === 1 ? "" : "s") + '</div></div>';
    html += '<div class="filter-row">' + ["all", "need", "partial", "have"].map(function (v) {
      var label = v === "all" ? "All " + counts.all : v.charAt(0).toUpperCase() + v.slice(1) + " " + counts[v];
      return '<button class="chip' + (state.invFilter === v ? " active" : "") + '" data-h="' + H(function () { state.invFilter = v; renderTab(); }) + '">' + esc(label) + '</button>';
    }).join("") + '</div>';

    if (!data.sections.length) html += '<div class="empty-all">No inventory sections yet.</div>';
    container.innerHTML = html;

    if (!data.sections.length && !ro) renderAddSectionRow(container, data.sections, "e.g. Bottling supplies");

    data.sections.forEach(function (sec) {
      var block = el('<div class="sec-block"></div>');
      block.innerHTML = renderSectionControls(sec, data.sections, ro);
      var filtered = state.invFilter === "all" ? sec.items : sec.items.filter(function (it) { return invStatus(it) === state.invFilter; });
      if (!filtered.length) block.insertAdjacentHTML("beforeend", '<div class="sec-empty">' + (sec.items.length ? "No items match this filter." : "No items in this section yet.") + '</div>');
      else filtered.forEach(function (it) {
        var st = invStatus(it);
        var pct = it.neededQty > 0 ? Math.min(100, Math.round((it.haveQty / it.neededQty) * 100)) : 100;
        var showPrice = it.haveQty < it.neededQty && it.price;
        block.insertAdjacentHTML("beforeend",
          '<button class="row-item" data-h="' + H(function () { openInventoryModal(it, sec.items); }) + '">' +
          '<div class="row-main"><div class="row-name">' + esc(it.name) + '</div><div class="inv-qty-row"><div class="inv-bar"><div class="inv-bar-fill" style="width:' + pct + '%;background:' + invStatusColorVar(st) + '"></div></div><span class="inv-qty-txt num">' + it.haveQty + ' / ' + it.neededQty + ' ' + esc(it.unit) + '</span></div></div>' +
          (showPrice ? '<div class="row-price num">' + it.price + '<div class="cur">kr</div></div>' : "") + '</button>');
      });
      var secTotal = sec.items.filter(function (it) { return it.haveQty < it.neededQty && it.price; }).reduce(function (a, it) { return a + it.price; }, 0);
      if (secTotal > 0) block.insertAdjacentHTML("beforeend", '<div class="sec-total"><span>Section total</span><span class="num">' + secTotal.toLocaleString() + ' kr</span></div>');
      if (!ro) {
        renderAddInvRow(block, sec.items);
        renderAddSectionRow(block, data.sections, "e.g. Bottling supplies", data.sections.indexOf(sec) + 1);
      }
      container.appendChild(block);
    });

    wireAll(container, TAB_H);
  }

  function renderAddInvRow(wrap, itemsArr) {
    var addWrap = el('<div style="padding:8px 16px 4px;"></div>');
    var btn = el('<button type="button" class="add-row">' + icon("plus", 13) + 'Add item</button>');
    addWrap.appendChild(btn);
    wrap.appendChild(addWrap);
    btn.addEventListener("click", function () {
      var form = el(
        '<div class="inline-form" style="margin:0;">' +
        '<div><span class="field-label">Item name</span><input class="field-input" id="iaName" placeholder="e.g. Test Kit"></div>' +
        '<div class="row2"><div><span class="field-label">Have</span><input type="number" min="0" class="field-input" id="iaHave" value="0"></div><div><span class="field-label">Needed</span><input type="number" min="0" class="field-input" id="iaNeed" value="1"></div></div>' +
        '<div class="row2"><div><span class="field-label">Unit</span><input class="field-input" id="iaUnit" placeholder="e.g. bottles"></div><div><span class="field-label">Cost to finish (kr)</span><input type="number" min="0" class="field-input" id="iaPrice" placeholder="optional"></div></div>' +
        '<div class="form-actions"><button type="button" class="btn primary" id="iaSave">Add item</button><button type="button" class="btn ghost" id="iaCancel">Cancel</button></div>' +
        '</div>'
      );
      addWrap.replaceChild(form, btn);
      form.querySelector("#iaName").focus();
      form.querySelector("#iaCancel").addEventListener("click", function () { renderTab(); });
      form.querySelector("#iaSave").addEventListener("click", function () {
        var name = form.querySelector("#iaName").value.trim();
        if (!name) { form.querySelector("#iaName").focus(); return; }
        var priceVal = form.querySelector("#iaPrice").value;
        itemsArr.push({ id: uid("i"), name: name, haveQty: +form.querySelector("#iaHave").value || 0, neededQty: +form.querySelector("#iaNeed").value || 1, unit: form.querySelector("#iaUnit").value.trim() || "units", price: priceVal ? +priceVal : null });
        saveState(); renderTab();
      });
    });
  }

  function openInventoryModal(it, itemsArr) {
    MODAL_H = [];
    var ro = isReadOnly();       // gates only the destructive "Remove this item" action
    var roEdit = isArchived();   // name/quantity/unit/price/tags stay editable even while locked
    var html = '<div class="modal-eyebrow">Item</div>';
    if (roEdit) html += '<div class="title-input" style="cursor:default;">' + esc(it.name) + '</div>';
    else html += '<input class="title-input" data-hc="' + MH(function (e) { it.name = e.target.value || it.name; saveState(); }) + '" value="' + esc(it.name) + '">';
    html += '<div class="modal-section"><h4>Quantity</h4><div class="row2">' + field("Have", "number", it.haveQty, function (v) { it.haveQty = +v || 0; }) + field("Needed", "number", it.neededQty, function (v) { it.neededQty = +v || 0; }) + '</div>' +
      '<div style="margin-top:8px;">' + field("Unit", "text", it.unit, function (v) { it.unit = v || "units"; }) + '</div></div>';
    html += '<div class="modal-section"><h4>Cost to finish (kr)</h4>' + field(null, "number", it.price == null ? "" : it.price, function (v) { it.price = v === "" ? null : +v; }) + '</div>';
    html += '<div class="modal-section"><h4>Tag to phases</h4><div id="phaseTagList"></div></div>';
    var refCount = countRefsToInv(it.id);
    if (!ro) html += '<button type="button" class="danger-link" id="delInvBtn">Remove this item</button>';

    var sheet = openModal(html);

    // Tagging phases used to be one long checklist with the full branch breadcrumb
    // repeated on every row -- with a season of any size that turns into a wall of text.
    // Now: already-tagged phases show as compact removable chips up top, and the picker
    // below is grouped by branch (short headings, not repeated breadcrumbs) with a search
    // box to jump straight to a phase instead of scanning the whole list.
    function renderPhaseTags() {
      var wrap = sheet.querySelector("#phaseTagList");
      var phases = allPhasesFlat();

      function isTagged(node) { return findResolvedIds(node).indexOf(it.id) !== -1; }
      function toggleTag(node, on) {
        if (!node.invIds) node.invIds = [];
        var idx = node.invIds.indexOf(it.id), idx2 = node.invIds.indexOf("INV:" + it.name);
        if (on) { if (idx === -1 && idx2 === -1) node.invIds.push(it.id); }
        else {
          if (idx !== -1) node.invIds.splice(idx, 1);
          idx2 = node.invIds.indexOf("INV:" + it.name);
          if (idx2 !== -1) node.invIds.splice(idx2, 1);
        }
        saveState();
      }

      if (roEdit) {
        var linked = phases.filter(function (p) { return isTagged(p.node); });
        wrap.innerHTML = linked.length ? '<div class="tag-chip-row">' + linked.map(function (p) {
          return '<span class="link-chip">' + esc(p.name) + (p.group ? '<span class="tc-group"> · ' + esc(p.group) + '</span>' : "") + '</span>';
        }).join("") + '</div>' : '<div class="empty-note">Not tagged to any phase.</div>';
        return;
      }
      if (!phases.length) { wrap.innerHTML = '<div class="empty-note">No phases yet — add some on the Timeline tab first.</div>'; return; }

      var groups = {}, order = [];
      phases.forEach(function (p) {
        var key = p.group || "Main sequence";
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(p);
      });

      wrap.innerHTML =
        '<div class="tag-chip-row" id="taggedChips"></div>' +
        '<input type="text" class="field-input" id="phaseSearchInput" placeholder="Search phases…">' +
        '<div id="phaseGroupList">' + order.map(function (key) {
          return '<div class="tag-group"><div class="tag-group-title">' + esc(key) + '</div>' +
            groups[key].map(function (p) {
              return '<label class="tag-pick-row" data-phase-name="' + esc(p.name.toLowerCase()) + '"><input type="checkbox" data-phase-id="' + p.node.id + '"' + (isTagged(p.node) ? " checked" : "") + '><span class="tp-name">' + esc(p.name) + '</span></label>';
            }).join("") + '</div>';
        }).join("") + '</div>';

      function updateChips() {
        var chipsEl = wrap.querySelector("#taggedChips");
        var linked = phases.filter(function (p) { return isTagged(p.node); });
        chipsEl.innerHTML = linked.length ? linked.map(function (p) {
          return '<span class="tag-chip"><span>' + esc(p.name) + '</span><button type="button" class="tc-x" data-untag="' + p.node.id + '">' + icon("x", 10) + '</button></span>';
        }).join("") : '<span class="tag-empty-hint">Not tagged yet — pick from the list below.</span>';
        chipsEl.querySelectorAll("[data-untag]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var phaseId = btn.getAttribute("data-untag");
            var match = phases.filter(function (p) { return p.node.id === phaseId; })[0];
            if (!match) return;
            toggleTag(match.node, false);
            var cb = wrap.querySelector('input[type=checkbox][data-phase-id="' + phaseId + '"]');
            if (cb) cb.checked = false;
            updateChips();
          });
        });
      }
      updateChips();

      wrap.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var phaseId = cb.getAttribute("data-phase-id");
          var match = phases.filter(function (p) { return p.node.id === phaseId; })[0];
          if (!match) return;
          toggleTag(match.node, cb.checked);
          updateChips();
        });
      });

      var searchInput = wrap.querySelector("#phaseSearchInput");
      searchInput.addEventListener("input", function () {
        var q = searchInput.value.trim().toLowerCase();
        wrap.querySelectorAll(".tag-group").forEach(function (g) {
          var anyVisible = false;
          g.querySelectorAll(".tag-pick-row").forEach(function (row) {
            var match = !q || row.getAttribute("data-phase-name").indexOf(q) !== -1;
            row.style.display = match ? "" : "none";
            if (match) anyVisible = true;
          });
          g.style.display = anyVisible ? "" : "none";
        });
      });
    }
    renderPhaseTags();

    if (!ro) sheet.querySelector("#delInvBtn").addEventListener("click", function () {
      var msg = 'Remove "' + it.name + '" from inventory?' + (refCount ? " It's tagged on " + refCount + " timeline phase(s) — those tags will be cleared." : "") + " This can't be undone.";
      showConfirm(msg, "Remove", function () {
        clearInvIdRefs(it.id, it.name);
        itemsArr.splice(itemsArr.indexOf(it), 1);
        saveState(); closeModal();
      });
    });
    function field(label, type, val, setter) {
      return '<div>' + (label ? '<span class="field-label">' + label + '</span>' : "") + '<input type="' + type + '" class="field-input" value="' + esc(val) + '"' + (roEdit ? " disabled" : "") + (roEdit ? "" : ' data-hc="' + MH(function (e) { setter(e.target.value); saveState(); }) + '"') + '></div>';
    }
  }

  /* ============================================================
     RENDER: LIBRARY
     ============================================================ */
  function renderLibraryTab(container) {
    var ro = isReadOnly();
    var any = LIBRARY.sections.some(function (s) { return s.items.length; });
    var html = LIBRARY.sections.length ? "" : '<div class="empty-all">No library sections yet.</div>';
    container.innerHTML = html;

    if (!LIBRARY.sections.length && !ro) renderAddSectionRow(container, LIBRARY.sections, "e.g. Recipes");

    LIBRARY.sections.forEach(function (sec) {
      var block = el('<div class="sec-block"></div>');
      block.innerHTML = renderSectionControls(sec, LIBRARY.sections, ro);
      if (!sec.items.length) block.insertAdjacentHTML("beforeend", '<div class="sec-empty">No items in this section yet.</div>');
      else sec.items.forEach(function (it) {
        var typeIcon = it.type === "video" ? "play" : it.type === "photo" ? "image" : "filetext";
        block.insertAdjacentHTML("beforeend",
          '<button class="row-item" data-h="' + H(function () { openLibraryModal(it, sec.items); }) + '">' +
          '<span class="lib-icon">' + (it.image ? '<img src="' + it.image + '">' : icon(typeIcon, 15)) + '</span>' +
          '<div class="row-main"><div class="row-name">' + esc(it.title) + '</div><div class="lib-preview">' + esc(it.content || "") + '</div></div></button>');
      });
      if (!ro) {
        renderAddLibRow(block, sec.items);
        renderAddSectionRow(block, LIBRARY.sections, "e.g. Recipes", LIBRARY.sections.indexOf(sec) + 1);
      }
      container.appendChild(block);
    });

    wireAll(container, TAB_H);
  }

  function renderAddLibRow(wrap, itemsArr) {
    var addWrap = el('<div style="padding:8px 16px 4px;"></div>');
    var btn = el('<button type="button" class="add-row">' + icon("plus", 13) + 'Add item</button>');
    addWrap.appendChild(btn);
    wrap.appendChild(addWrap);
    btn.addEventListener("click", function () {
      var form = el(
        '<div class="inline-form" style="margin:0;">' +
        '<div><span class="field-label">Title</span><input class="field-input" id="laTitle" placeholder="e.g. Fining Agents Guide"></div>' +
        '<div><span class="field-label">Type</span><select class="field-input" id="laType"><option value="pdf">PDF</option><option value="video">Video</option><option value="photo">Photo</option><option value="note" selected>Note</option></select></div>' +
        '<div id="laPhotoWrap" style="display:none;"><span class="field-label">Photo</span><input type="file" accept="image/*" class="field-input" id="laPhoto"></div>' +
        '<div><span class="field-label">Notes / description</span><textarea class="field-input" id="laContent"></textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn primary" id="laSave">Add item</button><button type="button" class="btn ghost" id="laCancel">Cancel</button></div>' +
        '</div>'
      );
      addWrap.replaceChild(form, btn);
      form.querySelector("#laTitle").focus();
      form.querySelector("#laType").addEventListener("change", function (e) { form.querySelector("#laPhotoWrap").style.display = e.target.value === "photo" ? "" : "none"; });
      form.querySelector("#laCancel").addEventListener("click", function () { renderTab(); });
      form.querySelector("#laSave").addEventListener("click", function () {
        var title = form.querySelector("#laTitle").value.trim();
        if (!title) { form.querySelector("#laTitle").focus(); return; }
        var type = form.querySelector("#laType").value;
        var content = form.querySelector("#laContent").value.trim();
        function finish(imgUrl) { itemsArr.push({ id: uid("l"), title: title, type: type, content: content, image: imgUrl || null }); saveState(); renderTab(); }
        if (type === "photo" && form.querySelector("#laPhoto").files[0]) readAndCompress(form.querySelector("#laPhoto").files[0], 1000, 0.75, function (dataUrl) { finish(dataUrl); });
        else finish(null);
      });
    });
  }

  function openLibraryModal(it, itemsArr) {
    MODAL_H = [];
    var ro = isReadOnly();       // gates only the destructive "Delete this item" action
    var roEdit = isArchived();   // title/content stay editable even while locked
    var typeLabel = it.type === "video" ? "Video" : it.type === "photo" ? "Photo" : it.type === "pdf" ? "PDF" : "Note";
    var html = '<div class="modal-eyebrow">' + typeLabel + '</div>';
    if (roEdit) html += '<div class="title-input" style="cursor:default;">' + esc(it.title) + '</div>';
    else html += '<input class="title-input" data-hc="' + MH(function (e) { it.title = e.target.value || it.title; saveState(); }) + '" value="' + esc(it.title) + '">';
    if (it.image) html += '<img class="lib-photo-full" src="' + it.image + '" data-h="' + MH(function () { openLightbox(it.image); }) + '">';
    html += '<textarea class="field-input" style="min-height:100px;"' + (roEdit ? " disabled" : "") + (roEdit ? "" : ' data-hc="' + MH(function (e) { it.content = e.target.value; saveState(); }) + '"') + '>' + esc(it.content || "") + '</textarea>';
    if (it.type === "video" || it.type === "pdf") html += '<button type="button" class="ext-link-btn" data-h="' + MH(function () { toast("This is a prototype — no real file is attached yet."); }) + '">' + icon(it.type === "video" ? "play" : "filetext", 15) + (it.type === "video" ? "Watch video" : "Open PDF") + '</button>';
    if (!ro) html += '<button type="button" class="danger-link" id="delLibBtn">Delete this item</button>';
    var sheet = openModal(html);
    if (!ro) sheet.querySelector("#delLibBtn").addEventListener("click", function () {
      showConfirm('Delete "' + it.title + '"? This can\'t be undone.', "Delete", function () {
        itemsArr.splice(itemsArr.indexOf(it), 1);
        saveState(); closeModal();
      });
    });
  }

  function openSettingsModal() {
    MODAL_H = [];
    var html = '<div class="title-input" style="cursor:default;">Alert settings</div>';
    html += '<div class="modal-section"><h4>Inventory shortage alerts</h4>';
    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:13px;">Warn me</span><input type="number" min="0" max="365" class="field-input" id="alertDaysInput" style="width:66px;" value="' + state.alertDays + '"><span style="font-size:13px;">days before a phase starts</span></div>';
    html += '</div>';
    html += '<div class="modal-section"><h4>Event alerts</h4>';
    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:13px;">Warn me</span><input type="number" min="0" max="365" class="field-input" id="eventAlertDaysInput" style="width:66px;" value="' + state.eventAlertDays + '"><span style="font-size:13px;">days before an event</span></div>';
    html += '</div>';
    var sheet = openModal(html);
    var input = sheet.querySelector("#alertDaysInput");
    input.addEventListener("change", function () {
      var v = parseInt(input.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      state.alertDays = v;
      input.value = v;
      saveState();
      toast("Inventory alerts now show " + v + " day" + (v === 1 ? "" : "s") + " ahead.");
    });
    var eventInput = sheet.querySelector("#eventAlertDaysInput");
    eventInput.addEventListener("change", function () {
      var v = parseInt(eventInput.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      state.eventAlertDays = v;
      eventInput.value = v;
      saveState();
      toast("Event alerts now show " + v + " day" + (v === 1 ? "" : "s") + " ahead.");
    });
  }

  /* ============================================================
     SHELL
     ============================================================ */
  function goToTab(tab) { state.tab = tab; renderTab(); }

  function renderHeaderBar() {
    var scroll = document.getElementById("appScroll");
    var existing = scroll.querySelector(".vintage-bar");
    if (existing) existing.remove();
    if (state.tab !== "timeline") return;
    var bar = el('<div class="vintage-bar"></div>');
    var years = Object.keys(SEASONS).sort(function (a, b) { return b - a; });
    bar.innerHTML =
      '<div class="vintage-row"><label>Vintage</label><select class="vintage-select" id="vintageSelect">' +
      years.map(function (y) { return '<option value="' + y + '"' + (+y === state.year ? " selected" : "") + '>' + y + (y === "2026" ? " (current)" : "") + '</option>'; }).join("") + '</select></div>' +
      (season().status !== "current" ? '<div class="readonly-banner">Past vintage — browsing read-only</div>' : "") +
      '<div class="view-toggle">' +
      '<button class="' + (state.timelineView === "timeline" ? "active" : "") + '" id="vtTimeline">' + icon("timeline", 15) + 'Timeline</button>' +
      '<button class="' + (state.timelineView === "tree" ? "active" : "") + '" id="vtTree">' + icon("branch", 15) + 'Tree</button>' +
      '<button class="' + (state.timelineView === "calendar" ? "active" : "") + '" id="vtCalendar">' + icon("calendar", 15) + 'Calendar</button>' +
      '</div>';
    scroll.insertBefore(bar, scroll.firstChild);
    bar.querySelector("#vintageSelect").addEventListener("change", function (e) { state.year = +e.target.value; state.calMonth = null; saveState(); renderTab(); });
    bar.querySelector("#vtTimeline").addEventListener("click", function () { state.timelineView = "timeline"; renderTab(); });
    bar.querySelector("#vtTree").addEventListener("click", function () { state.timelineView = "tree"; renderTab(); });
    bar.querySelector("#vtCalendar").addEventListener("click", function () { state.timelineView = "calendar"; renderTab(); });
  }

  function renderTab() {
    TAB_H = [];
    if (season().root.length) syncStatuses(season().root);
    var scroll = document.getElementById("appScroll");
    var container = scroll.querySelector(".tab-body");
    if (!container) { container = el('<div class="tab-body"></div>'); scroll.appendChild(container); }
    container.innerHTML = "";
    renderHeaderBar();
    if (state.tab === "timeline") {
      if (state.timelineView === "calendar") renderCalendarView(container);
      else if (state.timelineView === "tree") renderTreeView(container);
      else renderTimelineView(container);
    }
    else if (state.tab === "inventory") renderInventoryTab(container);
    else if (state.tab === "library") renderLibraryTab(container);
    renderBottomNav();
    renderLockBtn();
  }

  function renderBottomNav() {
    var nav = document.getElementById("bottomNav");
    var items = [{ id: "timeline", ic: "timeline", label: "Timeline" }, { id: "inventory", ic: "crate", label: "Inventory" }, { id: "library", ic: "book", label: "Library" }];
    nav.innerHTML = items.map(function (it) { return '<button class="nav-item' + (state.tab === it.id ? " active" : "") + '" data-nav="' + it.id + '">' + icon(it.ic, 20) + '<div class="nav-label">' + it.label + '</div></button>'; }).join("");
    nav.querySelectorAll("[data-nav]").forEach(function (btn) { btn.addEventListener("click", function () { goToTab(btn.getAttribute("data-nav")); }); });
  }

  function renderLockBtn() {
    var b = document.getElementById("lockBtn");
    b.innerHTML = icon(state.locked ? "lock" : "unlock", 13);
    b.title = state.locked ? "Structural changes are locked (notes & item edits still work) — tap to unlock" : "Tap to lock adding/deleting phases, branches & items";
    b.classList.toggle("is-locked", !!state.locked);
  }

  /* ============================================================
     INIT
     ============================================================ */
  loadState();
  renderTab();
  document.getElementById("lockBtn").addEventListener("click", function () {
    state.locked = !state.locked; saveState(); toast(state.locked ? "Locked — notes and item edits still work" : "Unlocked"); renderTab();
  });
  document.getElementById("settingsBtn").innerHTML = icon("settings", 13);
  document.getElementById("settingsBtn").addEventListener("click", openSettingsModal);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var dismiss = document.querySelector("#confirmRoot .confirm-dismiss");
    if (dismiss) { dismiss.click(); return; }
    closeModal();
  });
})();
</script>
