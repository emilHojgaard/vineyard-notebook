<title>Vineyard Notebook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --parchment: #F2EEE5; --parchment-2: #E9E3D5; --paper-line: #DDD5C3;
    --ink: #232019; --ink-soft: #6A6153; --ink-faint: #9B9182;
    --surface: #FBF9F4; --surface-2: #F5F1E8; --border: #D6CBB0;
    --burgundy: #7C2E3A; --burgundy-deep: #5C2029; --grape: #6B2D5C; --barrel: #93765F; --vine: #4A5D23;
    --red-wine: #8B1538; --white-wine: #97731C;
    --cellar: #211A14; --shadow: rgba(30, 24, 17, 0.10);
    --status-have: #4A5D23; --status-partial: #97731C; --status-need: #8B1538;
    --st-upcoming: #8C8275; --st-active: #2E6E8E; --st-done: #4A5D23;
    --page-bg: #E4DFD2; --focus-ring: #2F6FB0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --parchment: #1C1712; --parchment-2: #241D16; --paper-line: #362B1F;
      --ink: #EFE7D9; --ink-soft: #B7A991; --ink-faint: #82755F;
      --surface: #241D16; --surface-2: #1F1912; --border: #443622;
      --burgundy: #C6647A; --burgundy-deep: #E08398; --grape: #B778A6; --barrel: #B79A7C; --vine: #8CAE5A;
      --red-wine: #D46A80; --white-wine: #D2AC4E;
      --cellar: #0D0A07; --shadow: rgba(0, 0, 0, 0.45);
      --status-have: #8CAE5A; --status-partial: #D2AC4E; --status-need: #D46A80;
      --st-upcoming: #96897A; --st-active: #6FB0D8; --st-done: #8CAE5A;
      --page-bg: #110D09; --focus-ring: #7FB4E8;
    }
  }
  :root[data-theme="dark"] {
    --parchment: #1C1712; --parchment-2: #241D16; --paper-line: #362B1F;
    --ink: #EFE7D9; --ink-soft: #B7A991; --ink-faint: #82755F;
    --surface: #241D16; --surface-2: #1F1912; --border: #443622;
    --burgundy: #C6647A; --burgundy-deep: #E08398; --grape: #B778A6; --barrel: #B79A7C; --vine: #8CAE5A;
    --red-wine: #D46A80; --white-wine: #D2AC4E;
    --cellar: #0D0A07; --shadow: rgba(0, 0, 0, 0.45);
    --status-have: #8CAE5A; --status-partial: #D2AC4E; --status-need: #D46A80;
    --st-upcoming: #96897A; --st-active: #6FB0D8; --st-done: #8CAE5A;
    --page-bg: #110D09; --focus-ring: #7FB4E8;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--ink); font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  svg.ic { display: block; flex-shrink: 0; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 40px 18px 64px; }
  .intro { max-width: 480px; text-align: center; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .intro strong { color: var(--ink); font-weight: 600; }

  .rig { display: flex; flex-direction: column; align-items: center; }
  .phone-frame { width: 380px; max-width: 92vw; height: 792px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 18px 40px var(--shadow); position: relative; }
  .notch { width: 60px; height: 4px; border-radius: 3px; background: var(--border); margin: 10px auto 0; }
  .phone-screen { width: 100%; height: calc(100% - 18px); background: var(--parchment); border-radius: 14px; overflow: hidden; position: relative; display: flex; flex-direction: column; margin-top: 4px; }

  .app-header { position: relative; background: var(--burgundy); color: #F6F0E4; padding: 13px 16px 11px; text-align: center; flex-shrink: 0; }
  .app-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .header-actions { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; }
  .lock-btn, .settings-btn { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.28); width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #F6F0E4; cursor: pointer; padding: 0; }
  .lock-btn.is-locked { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.5); }

  .app-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 88px; }
  .app-scroll::-webkit-scrollbar { width: 0; }

  .vintage-bar { background: var(--surface); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 9px; }
  .vintage-row { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .vintage-row label { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  select.vintage-select { padding: 6px 9px; background: var(--parchment-2); color: var(--ink); border: 1px solid var(--border); border-radius: 5px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .readonly-banner { font-size: 11.5px; text-align: center; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .view-toggle { display: flex; justify-content: center; gap: 6px; }
  .view-toggle button { flex: 1; max-width: 150px; padding: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--parchment-2); border: 1px solid transparent; border-radius: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .view-toggle button.active { background: var(--surface); border-color: var(--border); color: var(--burgundy); }

  /* ---------- timeline rail ---------- */
  .content-area { padding: 14px 16px; position: relative; }
  .tl-row { display: flex; gap: 8px; align-items: stretch; }
  .tl-rail { width: 16px; position: relative; flex-shrink: 0; }
  .tl-rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: color-mix(in srgb, var(--accent, var(--paper-line)) 45%, var(--paper-line)); transform: translateX(-1px); }
  .tl-row.tl-first .tl-rail::before { top: 21px; }
  .tl-row.tl-last .tl-rail::before { bottom: calc(100% - 21px); }
  .tl-dot { position: absolute; left: 50%; top: 21px; transform: translate(-50%, -50%); width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 3px var(--parchment); z-index: 1; }
  .tl-card-wrap { flex: 1; min-width: 0; padding-bottom: 8px; display: flex; flex-direction: column; }

  .phase-card { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; width: 100%; text-align: left; font: inherit; color: inherit; padding: 0; cursor: pointer; }
  .phase-card.is-active { border-color: var(--accent, var(--burgundy)); background: color-mix(in srgb, var(--accent, var(--burgundy)) 6%, var(--surface)); }
  .phase-card.is-done { opacity: .64; }
  .phase-header { padding: 11px 13px; min-height: 50px; display: flex; align-items: center; gap: 8px; }
  .phase-info { flex: 1; min-width: 0; }
  .phase-name { font-weight: 600; font-size: 14.5px; color: var(--ink); line-height: 1.3; }
  .phase-dates { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .phase-status { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--st-upcoming); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .phase-status.st-done { color: var(--st-done); }
  .phase-status.st-active { color: var(--st-active); }
  .ptag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .ptag { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .ptag.st-need { background: color-mix(in srgb, var(--status-need) 15%, transparent); color: var(--status-need); }
  .ptag.st-partial { background: color-mix(in srgb, var(--status-partial) 15%, transparent); color: var(--status-partial); }
  .ptag.st-have { background: color-mix(in srgb, var(--status-have) 15%, transparent); color: var(--status-have); }

  .phase-alert { display: flex; align-items: center; gap: 5px; margin: 8px 13px 11px; padding: 5px 8px; border-radius: 6px; background: color-mix(in srgb, var(--status-need) 12%, transparent); color: var(--status-need); font-size: 11px; font-weight: 600; line-height: 1.3; }
  .phase-alert .ic { flex-shrink: 0; }

  .tl-del-btn { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: none; border: none; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .tl-del-btn:hover { color: var(--status-need); background: color-mix(in srgb, var(--status-need) 12%, transparent); }
  .tl-add-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .tl-add-btn { display: flex; align-items: center; gap: 5px; border: 1.5px dashed var(--border); border-radius: 6px; background: none; color: var(--ink-faint); font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 5px 9px; }
  .tl-add-btn:hover { color: var(--ink-soft); border-color: var(--barrel); }
  .tl-branch-form { flex: 1 1 100%; display: flex; gap: 6px; margin-top: 6px; }
  .tl-branch-form input { flex: 1; min-width: 0; }
  .tl-branch-form-row { display: flex; gap: 6px; flex-shrink: 0; }

  .split-sep { display: flex; align-items: center; gap: 8px; margin: 2px 16px; padding: 0 2px; }
  .split-sep::before, .split-sep::after { content: ""; flex: 1; height: 1px; background: var(--paper-line); }
  .split-sep .sd { width: 5px; height: 5px; border-radius: 50%; background: var(--barrel); flex-shrink: 0; }

  .branch-tabs { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 16px 0; }
  .branch-tab { flex: 1; min-width: 74px; padding: 8px 6px; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
  .branch-tab .bt-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; opacity: .45; }
  .branch-tab .bn { font-size: 12px; font-weight: 600; color: var(--ink-faint); }
  .branch-tab.active { background: color-mix(in srgb, var(--tab-accent, var(--burgundy)) 14%, var(--surface)); border-color: var(--tab-accent, var(--burgundy)); }
  .branch-tab.active .bt-dot { opacity: 1; }
  .branch-tab.active .bn { color: var(--tab-accent, var(--burgundy)); font-weight: 700; }
  .bt-del { flex-shrink: 0; width: 21px; height: 21px; border-radius: 50%; border: none; background: none; color: inherit; opacity: .6; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .bt-del:hover { opacity: 1; }
  .add-branch-tab { flex: 0 0 auto; width: 34px; padding: 8px 6px; display: flex; align-items: center; justify-content: center; background: none; border: 1.5px dashed var(--border); border-radius: 6px; cursor: pointer; margin-bottom: 4px; color: var(--ink-faint); }
  .add-branch-tab:hover { color: var(--ink-soft); border-color: var(--barrel); }

  .inline-form { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 12px; margin: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
  .inline-form .row2 { display: flex; gap: 8px; }
  .inline-form .row2 > * { flex: 1; min-width: 0; }
  .field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); margin-bottom: 3px; display: block; }
  .field-input, select.field-input, textarea.field-input { width: 100%; padding: 8px 9px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); font-size: 13.5px; color: var(--ink); }
  textarea.field-input { resize: vertical; min-height: 56px; }
  .form-actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn { padding: 8px 14px; border-radius: 5px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .btn.primary { background: var(--burgundy); border-color: var(--burgundy); color: #fff; }
  .btn.ghost { background: none; border-color: transparent; color: var(--ink-soft); }
  .btn.small { padding: 5px 8px; font-size: 11.5px; }
  .btn[disabled] { opacity: .35; cursor: default; }

  .add-row { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 9px; margin: 8px 0 0; background: none; border: 1.5px dashed var(--border); border-radius: 7px; color: var(--ink-faint); font-size: 12px; font-weight: 600; cursor: pointer; }
  .add-row:hover { color: var(--ink-soft); border-color: var(--barrel); }

  /* ---------- calendar ---------- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 14px; }
  .cal-nav button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  .cal-month { font-weight: 600; font-size: 14.5px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 16px; }
  .cal-dow { font-size: 10px; text-align: center; color: var(--ink-faint); font-weight: 600; padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11.5px; position: relative; }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-cell .dots { display: flex; gap: 2px; margin-top: 3px; }
  .cal-cell .dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-cell.today { border-color: var(--burgundy); border-width: 1.5px; font-weight: 700; }
  .cal-agenda-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 4px 0 8px; }
  .cal-event { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface); border-radius: 6px; margin-bottom: 7px; border: 1px solid var(--border); cursor: pointer; }
  .cal-event .bar { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; min-height: 30px; }
  .cal-event .t { font-weight: 600; font-size: 13px; }
  .cal-event .d { font-size: 11px; color: var(--ink-soft); }
  .cal-check-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; vertical-align: 1px; }
  .cal-empty { font-size: 12.5px; color: var(--ink-faint); text-align: center; padding: 20px 0; }
  .export-btn { width: 100%; padding: 10px; background: none; border: 1.5px dashed var(--border); border-radius: 7px; color: var(--ink-faint); font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }

  /* ---------- tree (nodes & edges) view ---------- */
  .tree-hint { font-size: 11px; color: var(--ink-faint); text-align: center; padding: 0 4px 12px; }
  .tree-focus-clear { margin-left: 7px; font-size: 11px; font-weight: 700; color: var(--barrel); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
  .tree-scroll { overflow: auto; -webkit-overflow-scrolling: touch; max-width: 100%; padding: 2px 2px 10px; }
  .tree-canvas { position: relative; margin: 0 auto; }
  .tree-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .tree-svg path { transition: opacity .15s ease; }
  .tree-node { position: absolute; display: flex; align-items: center; gap: 5px; padding: 0 7px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent, var(--border)); cursor: pointer; box-shadow: 0 1px 3px var(--shadow); transition: transform .12s ease, opacity .15s ease; }
  .tree-node:active { transform: scale(0.96); }
  .tree-node.is-active { border-color: var(--accent, var(--burgundy)); border-left-color: var(--accent, var(--burgundy)); background: color-mix(in srgb, var(--accent, var(--burgundy)) 6%, var(--surface)); }
  .tree-node.is-done { opacity: .6; }
  .tree-node.is-dim { opacity: .25; }
  .tn-label { font-size: 10.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .tn-alert { flex-shrink: 0; color: var(--status-need); display: flex; }
  .tn-del { flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%; border: none; background: none; color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .tn-del:hover { color: var(--status-need); background: color-mix(in srgb, var(--status-need) 14%, transparent); }
  .tn-branch-tag-wrap { position: absolute; display: flex; align-items: center; gap: 3px; max-width: 124px; transition: opacity .15s ease; }
  .tn-branch-tag-wrap.is-dim { opacity: .4; }
  .tn-branch-tag { font: inherit; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; border: 1px solid; background: var(--surface); cursor: pointer; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; min-width: 0; box-shadow: 0 1px 2px var(--shadow); transition: transform .1s ease; }
  .tn-branch-tag:active { transform: scale(0.94); }
  .tn-branch-edit { flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 1px 2px var(--shadow); }
  .tn-branch-edit:hover { color: var(--ink-soft); border-color: var(--barrel); }
  .tn-root-tag-wrap { position: absolute; display: flex; align-items: center; gap: 3px; transform: translateX(-50%); }
  .tn-root-tag { font: inherit; font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; box-shadow: 0 1px 2px var(--shadow); }
  .tn-root-tag.is-static { cursor: default; }
  .tn-add-row { position: absolute; display: flex; gap: 4px; transition: opacity .15s ease; }
  .tn-add-btn { width: 20px; height: 20px; border-radius: 50%; border: 1px dashed var(--border); background: var(--surface); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .tn-add-btn:hover { color: var(--ink-soft); border-color: var(--barrel); }
  .tn-add-row.is-dim { opacity: .35; }
  .tn-fork-add { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 1px dashed var(--border); background: var(--surface); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 1px 2px var(--shadow); transition: opacity .15s ease; }
  .tn-fork-add:hover { color: var(--ink-soft); border-color: var(--barrel); }
  .tn-fork-add.is-dim { opacity: .35; }

  /* ---------- sections (inventory + library share this) ---------- */
  .summary-strip { margin: 14px 16px 4px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; display: flex; align-items: baseline; justify-content: space-between; }
  .summary-strip .amt { font-size: 17px; font-weight: 600; color: var(--burgundy); }
  .summary-strip .lbl { font-size: 11px; color: var(--ink-soft); }
  .filter-row { display: flex; gap: 6px; padding: 12px 16px 4px; flex-wrap: wrap; }
  .chip { padding: 6px 11px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--parchment); }

  .sec-block { margin: 16px 0 0; }
  .sec-head { display: flex; align-items: center; gap: 6px; padding: 0 16px; margin-bottom: 6px; }
  .sec-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); flex: 1; }
  input.sec-name-input { flex: 1; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 5px; min-width: 0; }
  input.sec-name-input:hover, input.sec-name-input:focus { border-color: var(--border); background: var(--surface); color: var(--ink-soft); }
  .sec-actions { display: flex; gap: 3px; flex-shrink: 0; }
  .sec-icon-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .sec-icon-btn:hover { color: var(--ink-soft); }
  .sec-total { display: flex; justify-content: space-between; padding: 8px 16px 2px; font-size: 11.5px; color: var(--ink-soft); }
  .sec-total .num { font-weight: 600; color: var(--ink); }
  .sec-empty { padding: 10px 16px; font-size: 12px; color: var(--ink-faint); font-style: italic; }

  .row-item { display: flex; align-items: center; gap: 11px; padding: 11px 16px; background: var(--surface); border-bottom: 1px solid var(--border); border-left: none; border-right: none; border-top: none; cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit; }

  var SEASONS = { 2026: seedSeason2026(), 2025: seedSeason2025(), 2024: seedSeason2024() };

  var STORE_KEY = "vineyard-notebook-v3";
  var state = { year: 2026, tab: "timeline", timelineView: "timeline", branchSelection: {}, invFilter: "all", calMonth: null, locked: false, alertDays: 14, eventAlertDays: 7, treeFocus: null };

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved.seasons) SEASONS = saved.seasons;
      if (saved.inventory) INVENTORY = saved.inventory;
      if (saved.library) LIBRARY = saved.library;
      if (saved.uidN) uidN = saved.uidN;
      if (saved.view) Object.keys(saved.view).forEach(function (k) { state[k] = saved.view[k]; });
    } catch (e) { /* ignore corrupted or unavailable storage */ }
  }
  function saveState() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        seasons: SEASONS, inventory: INVENTORY, library: LIBRARY, uidN: uidN,
        view: { year: state.year, tab: state.tab, timelineView: state.timelineView, branchSelection: state.branchSelection, invFilter: state.invFilter, locked: state.locked, alertDays: state.alertDays, eventAlertDays: state.eventAlertDays }
      }));
    } catch (e) { toast("Couldn't save — storage may be full. Try removing a large photo."); }
  }

  function season() { return SEASONS[state.year]; }
  function seasonTitle() { return season().title || (state.year + " Vintage"); }
  // A past/archived vintage is read-only everywhere, full stop. The editing-lock TOGGLE is
  // softer by design: it's meant to guard against accidentally restructuring the timeline or
  // deleting things, not to block everyday, low-risk edits. So isLocked() (aliased below as the
  // long-standing isReadOnly()) still gates every structural/destructive action -- adding or
  // deleting a phase or branch, deleting an inventory/library item, section changes -- while
  // isArchived() alone gates the handful of things that should keep working even when locked:
  // adding/deleting notes, and editing an existing item's own fields (name, quantity, unit,
  // price, phase tags).
  function isArchived() { return season().status !== "current"; }
  function isLocked() { return !!state.locked || isArchived(); }
  function isReadOnly() { return isLocked(); }

  function allInvItems() {
    var d = INVENTORY[state.year] || { sections: [] };
    var out = [];
    d.sections.forEach(function (s) { s.items.forEach(function (it) { out.push(it); }); });
    return out;
  }
  function findInvById(id) { var list = allInvItems(); for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function findInvSection(it) { var d = INVENTORY[state.year]; for (var i = 0; i < d.sections.length; i++) if (d.sections[i].items.indexOf(it) !== -1) return d.sections[i]; return null; }

  function allLibItems() { var out = []; LIBRARY.sections.forEach(function (s) { s.items.forEach(function (it) { out.push(it); }); }); return out; }
  function findLibSection(it) { for (var i = 0; i < LIBRARY.sections.length; i++) if (LIBRARY.sections[i].items.indexOf(it) !== -1) return LIBRARY.sections[i]; return null; }
  function findLibByTag(tag) {
    if (!tag) return null;
    if (tag.indexOf("LIB:") === 0) { var title = tag.slice(4); var all = allLibItems(); for (var i = 0; i < all.length; i++) if (all[i].title === title) return all[i]; return null; }
    var all2 = allLibItems(); for (var j = 0; j < all2.length; j++) if (all2[j].id === tag) return all2[j];
    return null;
  }
  function findInvByTag(tag) {
    if (!tag) return null;
    if (tag.indexOf("INV:") === 0) { var name = tag.slice(4); var all = allInvItems(); for (var i = 0; i < all.length; i++) if (all[i].name === name) return all[i]; return null; }
    return findInvById(tag);
  }

  function invStatus(it) { if (it.haveQty <= 0) return "need"; if (it.haveQty < it.neededQty) return "partial"; return "have"; }
  function invStatusColorVar(st) { return "var(--status-" + st + ")"; }

  // ---- inventory-shortage alerts on phase cards ----
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var d = parseDate(dateStr);
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    d.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 86400000);
  }
  function phaseShortItems(n) {
    return (n.invIds || []).map(function (tag) { return findInvByTag(tag); }).filter(function (it) { return it && invStatus(it) !== "have"; });
  }

  // ---- status, synced automatically from the date range ----
  // A phase with both a start and an end date doesn't need its status set by hand: it's
  // upcoming before the start date, active during the range, and done once the end date
  // has passed. A phase missing either date has nothing to derive from and keeps whatever
  // status was set on it directly.
  function derivedStatus(n) {
    if (!n.start || !n.end) return n.status;
    var today = todayISO();
    if (today < n.start) return "upcoming";
    if (today > n.end) return "done";
    return "active";
  }
  function syncStatuses(nodes) {
    nodes.forEach(function (n) {
      if (n.start && n.end) n.status = derivedStatus(n);
      if (n.branches) n.branches.forEach(function (b) { syncStatuses(b.nodes); });
    });
  }

  // ---- upcoming sub-events (checks, tests, tasks) within a phase ----
  function ensureEvents(n) { if (!n.events) n.events = []; return n.events; }
  function upcomingPhaseEvents(n) {
    return (n.events || []).filter(function (ev) {
      var d = daysUntil(ev.date);
      return d !== null && d <= state.eventAlertDays;
    }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  // ---- alert badge on phase cards: inventory shortages + upcoming sub-events ----
  function phaseNeedsAttention(n) {
    if (n.status === "done") return false;
    if (upcomingPhaseEvents(n).length) return true;
    if (!n.start) return false;
    var d = daysUntil(n.start);
    if (d === null || d > state.alertDays) return false;
    return phaseShortItems(n).length > 0;
  }
  function phaseAlertText(n) {
    var evs = upcomingPhaseEvents(n);
    if (evs.length) {
      var ev = evs[0];
      var ed = daysUntil(ev.date);
      var evWhen = ed < 0 ? "overdue" : ed === 0 ? "today" : "in " + ed + " day" + (ed === 1 ? "" : "s");
      return esc(ev.name) + " — " + evWhen + (evs.length > 1 ? " (+" + (evs.length - 1) + " more)" : "");
    }
    var items = phaseShortItems(n);
    var d = daysUntil(n.start);
    var when = d < 0 ? "already underway" : d === 0 ? "starts today" : "starts in " + d + " day" + (d === 1 ? "" : "s");
    return (items.length === 1 ? esc(items[0].name) + " isn't fully stocked" : items.length + " items aren't fully stocked") + " — " + when;
  }

  function countRefsToInv(itemId) {
    var count = 0;
    function walk(nodes) { nodes.forEach(function (n) { if (n.invIds && n.invIds.length && findResolvedIds(n).indexOf(itemId) !== -1) count++; if (n.branches) n.branches.forEach(function (b) { walk(b.nodes); }); }); }
    walk(season().root);
    return count;
  }
  function clearInvIdRefs(itemId, itemName) {
    function walk(nodes) {
      nodes.forEach(function (n) {
        if (n.invIds && n.invIds.length) n.invIds = n.invIds.filter(function (tag) { return tag !== itemId && tag !== ("INV:" + itemName); });
        if (n.branches) n.branches.forEach(function (b) { walk(b.nodes); });
      });
    }
    walk(season().root);
  }
  function findResolvedIds(n) { return (n.invIds || []).map(function (tag) { var it = findInvByTag(tag); return it ? it.id : null; }); }

  // Flattens the season into {node, name, group} entries -- `group` is just the chain of
  // BRANCH names leading here (e.g. "Red" or "Red → Rosé"), not the full phase-by-phase
  // breadcrumb, so callers can group phases under a short, stable heading instead of
  // repeating a long path on every single row.
  function allPhasesFlat() {
    var out = [];
    function walk(nodes, group) {
      nodes.forEach(function (n) {
        out.push({ node: n, name: n.name, group: group });
        if (n.branches && n.branches.length) n.branches.forEach(function (b) { walk(b.nodes, group ? group + " → " + b.name : b.name); });
      });
    }
    walk(season().root, "");
    return out;
  }

  function toast(msg) {
    var root = document.getElementById("toastRoot");
    root.innerHTML = "";
    var t = el('<div class="toast"></div>');
    t.textContent = msg;
    root.appendChild(t);
